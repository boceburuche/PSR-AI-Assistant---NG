<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b3f" />
      <stop offset="50%" stop-color="#008751" />
      <stop offset="100%" stop-color="#004d2c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Safe Zone -->
  <rect width="512" height="512" rx="100" fill="url(#greenGrad)"/>
  
  <!-- Outer Gold Laurel / Border Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.65"/>
  <circle cx="256" cy="256" r="195" fill="#005a34" stroke="#ffffff" stroke-width="4"/>

  <!-- Federal Civil Service Shield Motif -->
  <path d="M256 100 L350 145 C350 250 256 315 256 325 C256 315 162 250 162 145 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="6"/>
  
  <!-- Green Chevron in Shield -->
  <path d="M256 120 L330 155 C330 235 256 290 256 295 C256 290 182 235 182 155 Z" fill="#008751"/>

  <!-- Open Law & Rules Book -->
  <path d="M210 200 C230 195 245 200 256 206 C267 200 282 195 302 200 L302 245 C282 240 267 245 256 250 C245 245 230 240 210 245 Z" fill="#ffffff"/>
  <path d="M256 206 L256 250" stroke="#008751" stroke-width="2.5"/>
  
  <!-- Scales of Justice Symbol on Top -->
  <path d="M256 142 L256 182" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
  <path d="M236 152 L276 152" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
  <path d="M236 152 L228 168 M236 152 L244 168" stroke="#fcd34d" stroke-width="1.5"/>
  <path d="M224 168 Q236 174 248 168 Z" fill="#fcd34d"/>
  <path d="M276 152 L268 168 M276 152 L284 168" stroke="#fcd34d" stroke-width="1.5"/>
  <path d="M264 168 Q276 174 288 168 Z" fill="#fcd34d"/>

  <!-- Banner at Bottom -->
  <rect x="136" y="348" width="240" height="52" rx="10" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
  <text x="256" y="378" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#004d2c" text-anchor="middle" letter-spacing="3">PSR 2021</text>
  <text x="256" y="426" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">FEDERAL CIVIL SERVICE</text>
  <text x="256" y="446" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#86efac" text-anchor="middle" letter-spacing="0.5">NIGERIA AI ASSISTANT</text>
