name: Wire 2021 PSR Chapter 14 into chatbot and Rulebook
on:
  push:
    paths:
      - scripts/wire_psr2021_chapter14.py
      - .github/workflows/wire-psr2021-chapter14.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted Chapter 14 patch
        run: python scripts/wire_psr2021_chapter14.py
      - name: Commit integration without touching unrelated chapter files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/psrCorpus.ts src/data/psrMasterIndex.ts src/components/ChatView.tsx src/components/RulebookView.tsx
          git diff --cached --quiet || (git commit -m "Integrate PSR 2021 Chapter 14 Allowances in Rulebook and chatbot" && git pull --rebase origin main && git push origin HEAD:main)
