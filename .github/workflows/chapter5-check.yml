name: Chapter 5 verification
on:
  pull_request:
    paths:
      - 'docs/psr2021-chapter5/**'
      - 'src/data/psr2021Chapter5.ts'
      - 'src/components/ChatView.tsx'
      - 'scripts/check-chapter5.mjs'
      - '.github/workflows/chapter5-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapter5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Chapter 5 original text consistency
        run: node scripts/check-chapter5.mjs
      - name: Typecheck
        run: bun run lint
      - name: Build
        run: bun run build
