name: Chapter 10 source transcription for manual QA
on:
  push:
    paths:
      - scripts/import_psr2021_ch10.py
      - .github/workflows/chapter10-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m pip install pymupdf
      - name: Generate 17 page transcriptions (OCR is NOT verified)
        run: python scripts/import_psr2021_ch10.py
      - name: Save transcriptions for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/psr2021-chapter10-ocr-review/ public/psr2021/chapter10/
          git diff --cached --quiet || (git commit -m "Add Chapter 10 OCR pages for manual review (not deployed)" && git push)
