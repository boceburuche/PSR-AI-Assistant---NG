name: Review Chapter 14 OCR against master source
on:
  push:
    paths:
      - scripts/review_psr2021_chapter14.py
      - .github/workflows/review-psr2021-chapter14.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate source-reviewed chapter 14 pages and QA report
        run: python scripts/review_psr2021_chapter14.py
      - name: Commit corrected page files without overwriting raw OCR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/psr2021-chapter14/source-reviewed/
          git diff --cached --quiet || (git commit -m "Add source-reviewed Chapter 14 pages and QA report" && git pull --rebase origin main && git push origin HEAD:main)
